name: Data source
description: Suggest a public data source for a Pardarsh project.
title: "data-source: "
labels: ["data-source"]
body:
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: Government department or organisation
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: What information does this source provide?
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Format and access method
      description: API, JSON, HTML, PDF, bulk download, etc.
  - type: textarea
    id: limitations
    attributes:
      label: Limitations
      description: Mention access restrictions, missing fields, instability, or other known issues.
